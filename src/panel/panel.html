<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>flax accessibility scanner</title>
  <link rel="stylesheet" href="panel.css">
</head>

<body>

  <!-- ===================== Main scan view ===================== -->
  <div id="scan-view" class="view">
    <!-- Top toolbar / header: logo + settings gear -->
    <header class="toolbar toolbar-brand">
      <div class="logo-placeholder" aria-hidden="true"></div>
      <h1 class="brand-name">flax</h1>
      <div class="toolbar-spacer"></div>
      <button id="settings-btn" class="btn btn-icon-only" title="Settings">
        <span class="visually-hidden">Settings</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </header>

    <main class="main-content">
      <!-- Results bar: Scan control, Best practices toggle, and summary text -->
      <section class="toolbar toolbar-results" id="results-toolbar" aria-label="Scan controls and summary">
        <button id="scan-btn" class="btn btn-primary">
          <span aria-hidden="true" class="btn-icon">▶</span> Scan
        </button>
        <button id="bp-toggle-btn" class="btn btn-toggle" aria-pressed="true">
          <span class="btn-toggle-dot" aria-hidden="true"></span>
          Best practices
        </button>
        <div class="toolbar-spacer"></div>
        <div class="results-meta">
          <div class="summary" id="summary-text">
            <span id="summary-count-text" role="status"></span><span id="summary-wcag-text">WCAG 2.1 AA</span>
          </div>
          <button id="export-csv-btn" class="btn btn-icon-only" title="Export as CSV" disabled>
            <span class="visually-hidden">Export as CSV</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </button>
        </div>
      </section>

      <!-- Main content area: single column before/without results, two columns once issues are found -->
      <div class="container" id="results-container">
        <!-- Left column: failed rules list -->
        <section aria-label="Failed rules" class="sidebar" id="failures-list">
          <div class="sidebar-content" id="failures-list-inner">
            <div class="empty-state">Click "Scan page" to get started.</div>
          </div>
        </section>

        <!-- Right column: details of the selected rule -->
        <section aria-label="Issues of selected rule" class="details-panel is-hidden" id="failure-details">
          <div class="empty-state">Select a rule from the list to see details.</div>
        </section>
      </div>
    </main>
  </div>

  <!-- ===================== Settings view ===================== -->
  <div id="settings-view" class="view is-hidden">
    <header class="toolbar toolbar-settings">
      <button id="settings-back-btn" class="btn btn-icon-only" title="Back to scan view">
        <span class="visually-hidden">Back to scan view</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      </button>
      <h1 class="settings-title">Settings</h1>
      <div class="toolbar-spacer"></div>
      <div class="settings-versions">
        <span>flax: <strong id="version-extension">—</strong></span>
        <a href="https://github.com/calanoix/flax" target="_blank" class="github-link"
          title="View source code on GitHub">
          <span class="visually-hidden">View source code on GitHub</span>
          <svg viewBox="0 0 98 96" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.04-4.135-.066-8.12-13.586 2.978-16.453-6.602-16.453-6.602-2.221-5.671-5.422-7.18-5.422-7.18-4.436-3.053.336-2.992.336-2.992 4.908.348 7.49 5.074 7.49 5.074 4.362 7.534 11.435 5.356 14.225 4.093.442-3.185 1.708-5.357 3.107-6.589-10.846-1.238-22.25-5.463-22.25-24.329 0-5.378 1.912-9.773 5.05-13.221-.502-1.242-2.193-6.257.481-13.042 0 0 4.103-1.323 13.443 5.044 3.899-1.092 8.081-1.637 12.238-1.657 4.152.02 8.337.565 12.243 1.657 9.33-6.367 13.428-5.044 13.428-5.044 2.68 6.785.989 11.8.487 13.042 3.144 3.448 5.044 7.843 5.044 13.221 0 18.918-11.42 23.078-22.302 24.291 1.758 1.53 3.327 4.52 3.327 9.117 0 6.58-.06 11.878-.06 13.493 0 1.314.877 2.876 3.334 2.398C84.02 89.38 98 70.968 98 49.217 98 22 76.155 0 48.854 0z" />
          </svg>
        </a>
        <span>axe-core: <strong id="version-axe">—</strong></span>
      </div>
    </header>

    <main class="settings-content">
      <div class="settings-card">
        <h2 class="settings-card-title">Appearance</h2>

        <div class="settings-field">
          <label for="theme-select">Extension theme</label>
          <div class="select-wrap">
            <select id="theme-select">
              <option value="system">Follow my browser's settings (Default)</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
        </div>
      </div>

      <div class="settings-card">
        <h2 class="settings-card-title">Rules and Issues</h2>

        <div class="settings-field settings-field-inline">
          <label>Best Practices</label>
        </div>

        <div class="radio-row" role="radiogroup" aria-label="Best Practices">
          <span class="radio-option">
            <input type="radio" name="best-practices" value="enable" id="bp-enable">
            <label for="bp-enable">Enable</label>
          </span>
          <span class="radio-option">
            <input type="radio" name="best-practices" value="disable" id="bp-disable">
            <label for="bp-disable">Disable</label>
          </span>
        </div>

        <div class="settings-field">
          <label for="wcag-select">Accessibility standard</label>
          <div class="select-wrap">
            <select id="wcag-select">
              <option value="wcag2a">WCAG 2.0 A</option>
              <option value="wcag2aa">WCAG 2.0 AA</option>
              <option value="wcag2aaa">WCAG 2.0 AAA</option>
              <option value="wcag21a">WCAG 2.1 A</option>
              <option value="wcag21aa">WCAG 2.1 AA</option>
              <option value="wcag21aaa">WCAG 2.1 AAA</option>
              <option value="wcag22a">WCAG 2.2 A</option>
              <option value="wcag22aa">WCAG 2.2 AA (Default)</option>
              <option value="wcag22aaa">WCAG 2.2 AAA</option>
            </select>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="panel.js"></script>
</body>

</html>
